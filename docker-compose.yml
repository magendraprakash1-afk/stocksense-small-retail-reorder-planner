version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: stocksense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense_password_dev
      POSTGRES_DB: stocksense_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: stocksense_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://stocksense:stocksense_password_dev@db:5432/stocksense_db
      DATABASE_URL_SYNC: postgresql://stocksense:stocksense_password_dev@db:5432/stocksense_db
      JWT_SECRET: dev_jwt_secret_key_stocksense_2026
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
